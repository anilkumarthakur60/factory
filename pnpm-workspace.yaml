packages:
  - packages/*
  - examples/*
  - docs

allowBuilds:
  esbuild: true

# brace-expansion < 5.0.11 has high-severity DoS advisories (GHSA-mh99-v99m-4gvg,
# GHSA-rgw5-rvv9-x895, GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7). It is only
# reached through eslint's minimatch; drop this once minimatch requires a fix.
overrides:
  brace-expansion@>=4.0.0 <5.0.11: ^5.0.11
