name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint + Typecheck + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The examples resolve @anil-labs/factory through its built dist/ (that is
      # their point), so they cannot typecheck until the package is built.
      - name: Build package
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is excluded: Vite 8's bundler (rolldown) imports
        # `node:util.styleText`, added in Node 20.12  it crashes at vitest
        # startup on Node 18. The published library itself has no Node 18-
        # incompatible code; this is purely a dev-toolchain constraint.
        node-version: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # pnpm 11 itself needs Node >= 22.13, so install on 22 and only then
      # switch to the Node version under test. Tests run vitest directly
      # rather than through pnpm for the same reason.
      - name: Setup Node.js 22 (for pnpm)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests with coverage
        working-directory: packages/factory
        run: ./node_modules/.bin/vitest run --coverage

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/factory/coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (tsup ESM/CJS/IIFE + dts, then size + node16 declaration checks)
        run: pnpm run build

      # Builds the examples against the freshly built package, which exercises
      # the real `exports` map, the emitted .d.ts, and the browser global.
      - name: Build examples (validates exports map + CDN global)
        run: pnpm run build:examples

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/factory/dist/
