name: Release

on:
  push:
    branches: [main]

# Only one release run at a time.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push version-bump commits / git tags
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # When changesets exist -> opens/updates a "Version Packages" PR.
      # When that PR is merged (no changesets left) -> builds and publishes.
      # `pnpm release` is `pnpm build && changeset publish`, so dist/ is always
      # rebuilt immediately before publishing.
      #
      # Publishing uses npm trusted publishing: pnpm exchanges this job's OIDC
      # token (`id-token: write` above) for a short-lived npm token and attaches
      # provenance, so no NPM_TOKEN secret is stored. The trust is configured on
      # npm with `npm trust github @anil-labs/factory --repo
      # anilkumarthakur60/factory --file release.yml`.
      - name: Create release PR or publish
        # v2 of the action requires Changesets CLI v3; this repo is on CLI v2.
        # Move both together (v2 renames the inputs to version-script/publish-script).
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
